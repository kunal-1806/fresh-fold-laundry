<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — FreshFold</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      font-family: "Plus Jakarta Sans", -apple-system, sans-serif; color: #0b1b33;
      background: radial-gradient(800px 500px at 70% 0%, #e6f0ff, transparent 65%), #f7fafc;
      text-align: center;
    }
    .bubble { font-size: 4rem; animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-12px); } }
    h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); letter-spacing: -.04em; margin: .5rem 0 .4rem; }
    h1 span { background: linear-gradient(100deg, #1d6ff2, #16b8c8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #4a5a72; max-width: 34ch; margin: 0 auto 1.8rem; }
    a {
      display: inline-block; padding: .85rem 1.6rem; border-radius: 999px; text-decoration: none;
      color: #fff; font-weight: 600; background: linear-gradient(135deg, #1d6ff2, #16b8c8);
      box-shadow: 0 10px 24px rgba(29, 111, 242, .3); transition: transform .15s ease;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <div class="bubble">🫧</div>
    <h1>This page went <span>missing</span></h1>
    <p>Probably lost in the dryer. Let's get you back to the clean side.</p>
    <a href="/">Back to FreshFold</a>
  </main>
</body>
</html>
